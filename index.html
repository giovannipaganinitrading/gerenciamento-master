<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Baixando Gerenciamento Master...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a1a1a;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 700px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    h1 {
      color: #25D366;
      font-size: 32px;
      margin-bottom: 20px;
      line-height: 1.3;
    }
    p {
      color: #cccccc;
      font-size: 22px;
      line-height: 1.5;
      margin-top: 30px;
    }
    .click-here {
      color: #25D366;
      font-weight: bold;
      text-decoration: underline;
      cursor: pointer;
    }
    .click-here:hover {
      color: #1ebe5a;
    }
    .arrow {
      position: fixed;
      top: 20px;
      right: 500px;
      font-size: 50px;
      color: #25D366;
      animation: bounce 1s infinite;
    }
    .arrow-label {
      position: fixed;
      top: 85px;
      right: 480px;
      color: #25D366;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }
    @keyframes bounce {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(15px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📥</div>
    <h1>SEU DOWNLOAD VAI COMEÇAR EM BREVE!<br>Caso não inicie, <a href="Gerenciamento_Master.zip" download="Gerenciamento_Master.zip" class="click-here" id="manualLink">clique aqui</a>.</h1>
    <p>Depois de pronto, verifique sua pasta de download.</p>
  </div>
  <div class="arrow">↗</div>
  <div class="arrow-label">Seu arquivo<br>aparece aqui</div>
  <script>
    fetch("Gerenciamento_Master.zip")
      .then(function(r) { return r.blob(); })
      .then(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "Gerenciamento_Master.zip";
        document.body.appendChild(a);
        a.click();
        URL.revokeObjectURL(url);
      });
  </script>
</body>
</html>
